name: Backend checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: grocerybuddy
          POSTGRES_PASSWORD: grocerybuddy
          POSTGRES_DB: grocerybuddy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grocerybuddy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://grocerybuddy:grocerybuddy@localhost:5432/grocerybuddy
      DJANGO_SETTINGS_MODULE: grocery_buddy.test_settings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --noinput
